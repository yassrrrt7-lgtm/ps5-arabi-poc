name: PS5 Arabi Hub Auto-Pipeline (Telegram + Auto-QA)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "analyze_and_send | extract_texts | qa_and_build | send_bug_photo"
        required: true
        type: choice
        options:
          - analyze_and_send
          - extract_texts
          - qa_and_build
          - send_bug_photo
      title_id:
        description: "PS5/PS4 Title ID (e.g. PPSA03524 or CUSA34285)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  run-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Universal Cloud Engine Tools (UnityPy + Arabic + repak)
        run: |
          python3 -m pip install --upgrade pip
          pip install requests arabic-reshaper python-bidi UnityPy
          # Download prebuilt repak CLI for Unreal Engine 4/5 .pak building
          REPAK_URL=$(curl -s https://api.github.com/repos/trumank/repak/releases/latest \
            | python3 -c "import sys,json; assets=json.load(sys.stdin).get('assets',[]); print(next((a['browser_download_url'] for a in assets if 'x86_64-unknown-linux' in a['name'] and a['name'].endswith('.tar.xz')), ''))")
          if [ -n "$REPAK_URL" ]; then
            curl -sL "$REPAK_URL" -o /tmp/repak.tar.xz
            tar -xJf /tmp/repak.tar.xz -C /tmp
            find /tmp -name repak -type f -exec sudo install -m 755 {} /usr/local/bin/repak \;
            repak --version || true
          fi

      - name: Run PS5 Arabi Hub v5 Ultimate Universal Engine
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -u arabi_hub_engine/hub_pipeline.py \
            --action "${{ github.event.inputs.action }}" \
            --title-id "${{ github.event.inputs.title_id }}"
